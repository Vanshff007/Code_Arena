name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # judge.test.js runs real submissions through these images - they
      # must exist before `npm test`, same as any fresh deployment.
      - name: Build code-execution sandbox images
        run: npm run docker:build

      - name: Run tests
        run: npm test

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Client tests read server source files (socket event names, language
      # list) to catch contract drift, so the full checkout is needed.
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
