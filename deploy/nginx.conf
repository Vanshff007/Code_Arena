# Template Nginx site config for CodeArena. Copy to
# /etc/nginx/sites-available/codearena, adjust the paths/domain below, then
# symlink it into sites-enabled and reload Nginx. Certbot (see DEPLOYMENT.md)
# will rewrite the server block to add TLS the first time it runs.
#
# Serves the built client as static files and reverse-proxies everything
# under /api and /socket.io to the PM2-managed Node process on 127.0.0.1:5000.

upstream codearena_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # Adjust to wherever the repo is checked out on the VPS.
    root /opt/codearena/client/dist;
    index index.html;

    # React Router - unknown paths fall back to index.html so client-side
    # routing can take over instead of Nginx 404ing them.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://codearena_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io needs the Upgrade/Connection headers to establish a
    # websocket - without these it silently falls back to (much slower)
    # long-polling instead of failing outright, so it's easy to miss if
    # this block is wrong.
    location /socket.io/ {
        proxy_pass http://codearena_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
