<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eaef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13151c" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes light.
      try {
        var t = localStorage.getItem('codearena_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Real-time 1v1 coding battles. Two players, one problem, first accepted answer wins." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>CodeArena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
